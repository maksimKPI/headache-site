  --ease:cubic-bezier(.2,.7,.1,1);
  --pad:clamp(4px,.8vw,12px);
  --gap:clamp(4px,.5vw,8px);
  --gutter:clamp(16px,4vw,56px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ivory:#E8E1CF}}
:root[data-theme="dark"]{--ivory:#E8E1CF}
*,*::before,*::after{box-sizing:inherit}
html{background:#000;scroll-behavior:smooth}
body{margin:0;background:#000;color:var(--ivory);font-family:"Roboto Flex","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--ivory);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.glow{text-shadow:0 0 6px color-mix(in srgb,var(--ivory) 50%,transparent),0 1px 2px rgba(0,0,0,.85)}
.mark{display:block;aspect-ratio:560/231;background:currentColor;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.star{display:block;aspect-ratio:240/242;background:currentColor;-webkit-mask:var(--revo) center/contain no-repeat;mask:var(--revo) center/contain no-repeat}

/* ---------- cover ---------- */
.hero{position:relative;height:100vh;height:100svh;min-height:520px;overflow:hidden;isolation:isolate;background:#000}
.hero picture,.hero picture img{position:absolute;inset:0;width:100%;height:100%}
.hero picture img{object-fit:cover;object-position:50% 55%;animation:settle 2.2s var(--ease) both}
@keyframes settle{from{opacity:0;transform:scale(1.06);filter:blur(10px)}60%{filter:blur(0)}to{opacity:1;transform:none;filter:none}}
.hero-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent 22%,transparent 48%,rgba(0,0,0,.78) 82%,rgba(0,0,0,.92))}
.hero-top{position:absolute;z-index:2;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:max(18px,env(safe-area-inset-top)) var(--gutter) 0}
.hero-top a{display:block;text-decoration:none}
.hero-top .mark{width:clamp(84px,9vw,118px)}
.hero-top .star{width:clamp(38px,3.6vw,50px)}
.hero-top .by{display:flex;align-items:center;gap:14px;font-size:11px;opacity:.8}
.hero-text{position:absolute;z-index:2;left:var(--gutter);right:var(--gutter);bottom:max(clamp(28px,6vh,64px),env(safe-area-inset-bottom));display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.hero h1{margin:0;font-size:clamp(58px,11vw,156px);font-weight:500;font-stretch:125%;line-height:.88;letter-spacing:-.035em;text-shadow:0 4px 40px rgba(0,0,0,.45);animation:rise 1.2s .5s var(--ease) both}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:18px;font-size:12px;opacity:.85;animation:rise 1.2s .7s var(--ease) both}
.hero-cap{margin:12px 0 0;max-width:30em;font-size:clamp(15px,1.3vw,17px);color:color-mix(in srgb,var(--ivory) 82%,transparent);animation:rise 1.2s .8s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.vcr{
  appearance:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;height:42px;padding:0 16px;border-radius:2px;text-decoration:none;
  font:600 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;
  color:var(--ivory);background:rgba(0,0,0,.3);border:1px solid color-mix(in srgb,var(--ivory) 55%,transparent);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background-color .2s,color .2s,border-color .2s;
}
.vcr:hover{background:var(--ivory);color:#000;border-color:var(--ivory);text-shadow:none}
.vcr svg{width:16px;height:16px;flex:none}
.hero .vcr{animation:rise 1.2s .9s var(--ease) both}

/* ---------- sticky bar ---------- */
.bar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;
  min-height:64px;padding:10px var(--gutter);background:rgba(0,0,0,.88);border-bottom:1px solid var(--graphite);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
}
.bar-title{display:flex;flex-direction:column;gap:3px;min-width:0}
.bar-title b{font-size:17px;font-weight:600;font-stretch:118%;letter-spacing:-.01em;line-height:1.1}
.bar-title span{font-size:10px;color:var(--ash)}
.tools{display:flex;gap:8px;flex:none}
.tools .vcr{height:38px;padding:0 13px;font-size:11px;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;border-color:color-mix(in srgb,var(--ivory) 30%,transparent)}
.tools .vcr:hover{background:var(--ivory)}
.tools .vcr[aria-busy="true"]{pointer-events:none;border-color:var(--ivory)}

/* ---------- grid ---------- */
.grid{padding:var(--pad);display:flex;gap:var(--gap);align-items:flex-start}
.grid.pre{display:block;columns:2;column-gap:var(--gap)}
@media (min-width:760px){.grid.pre{columns:3}}
@media (min-width:1200px){.grid.pre{columns:4}}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--gap)}
.ph{position:relative;display:block;width:100%;margin:0 0 var(--gap);padding:0;border:0;background:#0c0c0b;cursor:zoom-in;overflow:hidden;break-inside:avoid}
.col .ph{margin:0}
.ph img{width:100%;height:auto;opacity:0;transition:opacity .6s var(--ease),transform .9s var(--ease),filter .4s}
.ph img.in{opacity:1}
.ph-n{position:absolute;left:10px;bottom:9px;font-size:10px;opacity:0;transition:opacity .3s}
.ph-dl{
  position:absolute;top:8px;right:8px;width:34px;height:34px;display:grid;place-items:center;border-radius:2px;
  background:rgba(0,0,0,.55);color:var(--ivory);border:1px solid color-mix(in srgb,var(--ivory) 45%,transparent);
  opacity:0;transform:translateY(-4px);transition:opacity .25s,transform .25s,background-color .2s,color .2s;
}
.ph-dl svg{width:16px;height:16px}
.ph-dl:hover{background:var(--ivory);color:#000}
@media (hover:hover) and (pointer:fine){
  .ph:hover img{transform:scale(1.025);filter:brightness(1.08)}
  .ph:hover .ph-n,.ph:hover .ph-dl,.ph:focus-within .ph-dl{opacity:1;transform:none}
}

/* ---------- footer ---------- */
.foot{padding:clamp(56px,9vw,120px) var(--gutter) max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}
.foot .duo{display:flex;align-items:center;gap:clamp(16px,3vw,30px);color:var(--ivory)}
.foot .duo .mark{width:clamp(130px,16vw,190px)}
.foot .duo .star{width:clamp(56px,6vw,76px)}
.foot .duo .x{font-size:22px;font-weight:300;color:var(--ash)}
.foot p{margin:0;max-width:34em;color:var(--ash);font-size:15px}
.foot-links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.foot small{font-size:10px;color:var(--dim)}

/* ---------- viewer ---------- */
.lb{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .3s var(--ease),visibility 0s .3s}
.lb.open{opacity:1;visibility:visible;transition:opacity .3s var(--ease)}
.lb-top,.lb-bot{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(12px,2.4vw,28px)}
.lb-top{padding-top:max(12px,env(safe-area-inset-top))}
.lb-bot{padding-bottom:max(14px,env(safe-area-inset-bottom));min-height:52px}
.lb-count{font-size:12px}
.lb-count b{font-weight:600}
.lb-right{display:flex;gap:8px}
.lb .vcr{height:38px;padding:0 12px;font-size:11px;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
.lb .vcr.icon{width:38px;padding:0}
.lb-stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:pan-y}
.lb-track{display:flex;height:100%;transition:transform .45s var(--ease);will-change:transform}
.lb-track.drag{transition:none}
.lb-slide{flex:0 0 100%;height:100%;padding:0 clamp(0px,5vw,84px)}
.lb-slide .fit{position:relative;width:100%;height:100%}
.lb-slide{position:relative}
.lb-slide img{position:absolute;inset:0;width:100%;height:100%;max-width:none;object-fit:contain;user-select:none;-webkit-user-drag:none;opacity:0;transition:opacity .35s}
.lb-slide img.in{opacity:1}
.lb-arrow{position:absolute;z-index:3;top:50%;margin-top:-23px;width:46px;height:46px;padding:0}
.lb-arrow.prev{left:clamp(8px,1.6vw,22px)}.lb-arrow.next{right:clamp(8px,1.6vw,22px)}
.lb-meta{font-size:11px;color:var(--ash);display:flex;gap:16px}
.lb-osd{font-size:12px}
.lb-play .s-pause{display:none}
.lb.playing .lb-play .s-pause{display:inline}
.lb.playing .lb-play .s-play{display:none}
.lb-prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:transparent}
.lb-prog i{display:block;height:100%;width:0;background:var(--ivory);box-shadow:0 0 6px color-mix(in srgb,var(--ivory) 70%,transparent)}
.lb.playing .lb-prog i{animation:prog var(--slide,3.6s) linear forwards}
@keyframes prog{to{width:100%}}

.toast{position:fixed;z-index:120;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translate(-50%,12px);padding:12px 16px;border-radius:2px;background:var(--ivory);color:#000;font-size:11px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .hero-text{flex-direction:column;align-items:flex-start;gap:22px}
  .tools .vcr .t{display:none}
  .tools .vcr{width:40px;padding:0}
  .bar-title b{font-size:16px}
  .lb-arrow{display:none}
  .lb-slide{padding:0}
  .lb .vcr .t{display:none}
  .lb .vcr{width:40px;padding:0}
}
@media (hover:none) and (pointer:coarse){ .lb-arrow{display:none} }
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none !important;transition:none !important}
  .ph img,.lb-slide img{opacity:1}
}
</style>

  let curCols = 0;
  const layout = () => {
    const n = colsFor(innerWidth);
    if (n === curCols) return;
    curCols = n;
    const cols = Array.from({ length: n }, () => { const c = document.createElement('div'); c.className = 'col'; return c; });
    const h = new Array(n).fill(0);
    items.forEach(el => {
      const i = h.indexOf(Math.min(...h));
      cols[i].appendChild(el);
      h[i] += Number(el.dataset.h) / Number(el.dataset.w);
    });
    grid.classList.remove('pre');
    grid.replaceChildren(...cols);
  };
  layout();
  addEventListener('resize', layout);

  /* ---------- viewer ---------- */
  const lb = document.getElementById('lb'), track = document.getElementById('lbTrack'), stage = document.getElementById('lbStage');
  const elCur = document.getElementById('lbCur'), elMeta = document.getElementById('lbMeta'), elDl = document.getElementById('lbDl'), elOsd = document.getElementById('lbOsd'), prog = document.getElementById('lbProg');
  track.innerHTML = PHOTOS.map((p, i) => `<div class="lb-slide" data-i="${i}"><div class="fit"><img alt="Фото ${i + 1} з ${PHOTOS.length}" data-src="/revo/part-1/photos/lg/${p.file}" width="${p.lg[0]}" height="${p.lg[1]}" draggable="false"></div></div>`).join('');
  const slides = [...track.children];
  let idx = 0, isOpen = false, playing = false, playT = 0, lastFocus = null;
  const SLIDE_MS = 3600;
  lb.style.setProperty('--slide', SLIDE_MS + 'ms');

  const load = i => {
    const s = slides[i]; if (!s) return;
    const img = s.querySelector('img');
    if (!img.src) { img.addEventListener('load', () => img.classList.add('in'), { once: true }); img.src = img.dataset.src; }
  };
  const show = (n, instant) => {
    idx = (n + PHOTOS.length) % PHOTOS.length;
    track.classList.toggle('drag', !!instant);
    track.style.transform = `translateX(${-idx * 100}%)`;
    [idx, idx + 1, idx - 1, idx + 2].forEach(i => load((i + PHOTOS.length) % PHOTOS.length));
    const p = PHOTOS[idx];
    elCur.textContent = pad(idx + 1);
    elMeta.innerHTML = `<span>${p.w}×${p.h}</span><span>${mb(p.bytes)}</span>`;
    elDl.href = p.full;
    elDl.setAttribute('download', p.file);
    if (instant) requestAnimationFrame(() => track.classList.remove('drag'));
    if (playing) restartTimer();
  };
  const restartTimer = () => {
    clearTimeout(playT);
    prog.style.animation = 'none'; void prog.offsetWidth; prog.style.animation = '';
    playT = setTimeout(() => show(idx + 1), SLIDE_MS);
  };
  const setPlay = on => {
    playing = on && !reduce;
    lb.classList.toggle('playing', playing);
    elOsd.textContent = playing ? 'PLAY ►' : 'STILL ■';
    if (playing) restartTimer(); else clearTimeout(playT);
  };
  const open = (n, play) => {
    lastFocus = document.activeElement;
    isOpen = true;
    lb.removeAttribute('inert'); lb.setAttribute('aria-hidden', 'false'); lb.classList.add('open');
    document.documentElement.style.overflow = 'hidden';
    show(n, true); setPlay(!!play);
    history.pushState({ lb: true }, '');
    setTimeout(() => document.getElementById('lbClose').focus({ preventScroll: true, focusVisible: false }), 50);
  };
  const close = fromPop => {
    if (!isOpen) return;
    isOpen = false; setPlay(false);
    lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); lb.setAttribute('inert', '');
    document.documentElement.style.overflow = '';
    if (!fromPop && history.state && history.state.lb) history.back();
    if (lastFocus) lastFocus.focus({ preventScroll: true });
  };
  addEventListener('popstate', () => close(true));

  const saveFile = url => { const a = document.createElement('a'); a.href = url; a.download = url.split('/').pop(); document.body.appendChild(a); a.click(); a.remove(); };
  grid.addEventListener('keydown', e => { const d = e.target.closest('.ph-dl'); if (d && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); e.stopPropagation(); saveFile(d.dataset.dl); } });
  grid.addEventListener('click', e => {
    const d = e.target.closest('.ph-dl');
    if (d) { e.preventDefault(); saveFile(d.dataset.dl); return; }
    const ph = e.target.closest('.ph'); if (!ph) return;
    e.preventDefault(); open(Number(ph.dataset.i));
  });
  document.getElementById('lbClose').addEventListener('click', () => close());
  document.getElementById('lbPrev').addEventListener('click', () => show(idx - 1));
  document.getElementById('lbNext').addEventListener('click', () => show(idx + 1));
  document.getElementById('lbPlay').addEventListener('click', () => setPlay(!playing));
  document.getElementById('slideshow').addEventListener('click', () => open(0, true));
  addEventListener('keydown', e => {
    if (!isOpen) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') show(idx + 1);
    else if (e.key === 'ArrowLeft') show(idx - 1);
    else if (e.key === ' ') { e.preventDefault(); setPlay(!playing); }
  });
  /* tap the black around the photo to close */
  stage.addEventListener('click', e => { if (e.target.classList.contains('lb-slide') || e.target.classList.contains('fit')) close(); });

  /* swipe */
  let sx = 0, sy = 0, dx = 0, swiping = false, lock = null;
  stage.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; swiping = true; lock = null; sx = e.clientX; sy = e.clientY; dx = 0; });
  stage.addEventListener('pointermove', e => {
    if (!swiping) return;
    const x = e.clientX - sx, y = e.clientY - sy;
    if (lock === null && (Math.abs(x) > 8 || Math.abs(y) > 8)) lock = Math.abs(x) > Math.abs(y) ? 'x' : 'y';
    if (lock !== 'x') return;
    dx = x; track.classList.add('drag');
    track.style.transform = `translateX(calc(${-idx * 100}% + ${dx}px))`;
  });
  const endSwipe = () => {
    if (!swiping) return; swiping = false; track.classList.remove('drag');
    if (lock === 'x' && Math.abs(dx) > Math.min(70, stage.clientWidth * .14)) { show(idx + (dx < 0 ? 1 : -1)); if (playing) restartTimer(); }
    else track.style.transform = `translateX(${-idx * 100}%)`;
    if (lock === 'x') { const stop = ev => { ev.stopPropagation(); }; stage.addEventListener('click', stop, { capture: true, once: true }); setTimeout(() => stage.removeEventListener('click', stop, { capture: true }), 0); }
  };
  stage.addEventListener('pointerup', endSwipe);
  stage.addEventListener('pointercancel', endSwipe);

  /* ---------- share ---------- */
  document.getElementById('share').addEventListener('click', async () => {
    const data = { title: 'revo skate — headache', url: location.href.split('#')[0] };
    try {
      if (navigator.share) { await navigator.share(data); return; }
      await navigator.clipboard.writeText(data.url); toast('Посилання скопійовано');
    } catch (err) { if (err && err.name !== 'AbortError') toast(data.url); }
  });

  /* ---------- download everything as one zip, built in the browser ---------- */
  const dlAll = document.getElementById('dlAll'), dlLabel = dlAll.querySelector('.t'), dlText = dlLabel.textContent;
  const loadZip = () => new Promise((res, rej) => {
    if (window.JSZip) return res(window.JSZip);
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload = () => res(window.JSZip); s.onerror = rej; document.head.appendChild(s);
  });
  dlAll.addEventListener('click', async () => {
    dlAll.setAttribute('aria-busy', 'true');
    try {
      const JSZip = await loadZip();
      const zip = new JSZip();
      for (let i = 0; i < PHOTOS.length; i++) {
        dlLabel.textContent = `${i + 1} / ${PHOTOS.length}`; toast(`Готую архів: ${i + 1} / ${PHOTOS.length}`);
        const r = await fetch(PHOTOS[i].full);
        if (!r.ok) throw new Error(r.status);
        zip.file(PHOTOS[i].file, await r.blob(), { binary: true });
      }
      const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'revo-skate-headache.zip';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      toast('Архів готовий');
    } catch (err) {
      toast('Не вийшло. Завантажте фото по одному');
    } finally {
      dlLabel.textContent = dlText; dlAll.removeAttribute('aria-busy');
    }
  });
})();
</script>
</body>
</html>

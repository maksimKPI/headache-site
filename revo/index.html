@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ivory:#E8E1CF}}
:root[data-theme="dark"]{--ivory:#E8E1CF}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#000;color:var(--ivory)}
body{font-family:var(--mono);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ivory);outline-offset:3px}
.glow{text-shadow:0 0 6px color-mix(in srgb,var(--ivory) 55%,transparent),0 1px 2px rgba(0,0,0,.8)}

.page{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:18px;padding:clamp(16px,3vh,30px) 0}
.rlogo{display:block;width:clamp(150px,40vw,250px);aspect-ratio:1421/632;background:var(--ivory);-webkit-mask:var(--revo) center/contain no-repeat;mask:var(--revo) center/contain no-repeat;opacity:0;animation:fade .9s .1s var(--ease) forwards}

/* ---------- player ---------- */
.player{
  position:relative;flex:none;width:min(100%,1100px,calc((100svh - 370px) * 4 / 3));aspect-ratio:4/3;
  background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  opacity:0;transform:scale(.98);animation:in 1s .2s var(--ease) forwards;
}
.player[data-tape="2"]{width:min(100%,1100px,calc((100svh - 370px) * 1.85));aspect-ratio:1998/1080}
.deck{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.tapes{display:flex;justify-content:center;gap:10px;opacity:0;animation:fade .9s .4s var(--ease) forwards}
.tape{
  appearance:none;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:5px;
  min-width:124px;padding:9px 14px 10px;border-radius:2px;text-align:left;
  background:transparent;color:var(--ivory);border:1px solid color-mix(in srgb,var(--ivory) 22%,transparent);
  opacity:.55;transition:opacity .25s,border-color .25s,background-color .25s;
}
.tape:hover{opacity:.85}
.tape[aria-selected="true"]{opacity:1;border-color:color-mix(in srgb,var(--ivory) 60%,transparent);background:color-mix(in srgb,var(--ivory) 7%,transparent)}
.t-n{font-size:10px;font-weight:600;letter-spacing:.16em;opacity:.65}
.t-name{font-size:12px;font-weight:700;letter-spacing:.1em;white-space:nowrap}
.tape[aria-selected="true"] .t-name::before{content:"► ";font-size:9px;vertical-align:1px}
.player video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}
.player video::-webkit-media-controls{display:none !important}

.osd{position:absolute;z-index:3;top:14px;left:16px;font-size:clamp(12px,1.4vw,15px);font-weight:600;letter-spacing:.08em;color:var(--ivory);pointer-events:none;transition:opacity .4s var(--ease)}
.osd-r{left:auto;right:16px}

.big{
  position:absolute;z-index:4;left:50%;bottom:11%;transform:translateX(-50%);
  appearance:none;cursor:pointer;padding:10px 16px;border-radius:2px;
  background:rgba(0,0,0,.74);border:1px solid color-mix(in srgb,var(--ivory) 80%,transparent);color:var(--ivory);
  font-size:13px;font-weight:600;letter-spacing:.16em;white-space:nowrap;
  transition:background-color .2s,color .2s,opacity .3s;
}
.big:hover{background:var(--ivory);color:#000;text-shadow:none}
.started .big{display:none}


.bar{
  position:absolute;z-index:3;left:0;right:0;bottom:0;padding:34px 12px 12px;
  background:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,.35) 60%,transparent);
  transition:opacity .4s var(--ease),transform .4s var(--ease);
}
.idle .bar,.player:not(.started) .bar{opacity:0;transform:translateY(8px);pointer-events:none}
.player:not(.started) .osd-r{opacity:0}
.idle .osd{opacity:0}
.idle.is-playing{cursor:none}
.track{position:relative;height:22px;display:flex;align-items:center;cursor:pointer;touch-action:none;margin:0 2px 6px}
.track span{position:relative;display:block;width:100%;height:3px;background:color-mix(in srgb,var(--ivory) 25%,transparent)}
.track i{position:absolute;inset:0 auto 0 0;width:0;background:var(--ivory);box-shadow:0 0 6px color-mix(in srgb,var(--ivory) 70%,transparent)}
.track b{position:absolute;top:50%;left:0;width:4px;height:13px;margin:-6.5px 0 0 -2px;background:var(--ivory);box-shadow:0 0 6px color-mix(in srgb,var(--ivory) 70%,transparent)}
.row{display:flex;align-items:center;gap:6px}
.vcr{
  appearance:none;cursor:pointer;flex:none;height:30px;min-width:34px;padding:0 9px;border-radius:2px;
  display:inline-grid;place-items:center;font-size:12px;font-weight:600;letter-spacing:.08em;
  background:rgba(0,0,0,.35);color:var(--ivory);border:1px solid color-mix(in srgb,var(--ivory) 60%,transparent);
  transition:background-color .2s,color .2s;
}
.vcr:hover{background:var(--ivory);color:#000;text-shadow:none}
.vcr .s-pause,.vcr .s-on{display:none}
.is-playing .vcr .s-play{display:none}
.is-playing .vcr .s-pause{display:inline}
.unmuted .vcr .s-off{display:none}
.unmuted .vcr .s-on{display:inline}
.vcr svg{width:15px;height:15px;display:block}
.vcr.icon{padding:0;width:34px}
.vcr .fs-exit{display:none}
.is-full .vcr .fs-enter{display:none}
.is-full .vcr .fs-exit{display:block}
.vlab{flex:none;margin-left:6px;font-size:10px;font-weight:600;letter-spacing:.12em}
.vol{
  -webkit-appearance:none;appearance:none;flex:0 1 90px;min-width:50px;height:11px;margin:0;cursor:pointer;background:linear-gradient(to right,var(--ivory) var(--v,100%),color-mix(in srgb,var(--ivory) 28%,transparent) var(--v,100%));
  -webkit-mask:repeating-linear-gradient(to right,#000 0 5px,transparent 5px 7px);mask:repeating-linear-gradient(to right,#000 0 5px,transparent 5px 7px);
}
.vol::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:2px;height:11px;background:transparent}
.vol::-moz-range-thumb{width:2px;height:11px;border:0;background:transparent}
.vol[hidden],.vlab[hidden],.vcr[hidden]{display:none}
.time{margin-left:auto;padding:0 6px;font-size:12px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
.time small{font-size:10px;margin-right:6px;opacity:.85}

/* fullscreen on Android and computers keeps this player */
.player:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;max-width:none}
.player:-webkit-full-screen{width:100vw;height:100vh;aspect-ratio:auto;max-width:none}

/* ---------- link to the site ---------- */
.next{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;opacity:0;animation:fade .9s .5s var(--ease) forwards}
.next small{font-size:11px;font-weight:600;letter-spacing:.14em;opacity:.7}
.next b{
  display:inline-flex;align-items:center;gap:.6em;height:42px;padding:0 16px;border-radius:2px;
  font-size:13px;font-weight:600;letter-spacing:.1em;
  border:1px solid color-mix(in srgb,var(--ivory) 55%,transparent);transition:background-color .2s,color .2s;
}
.next:hover b,.next:focus-visible b{background:var(--ivory);color:#000;text-shadow:none}
.next b i{font-style:normal;opacity:.75}

@keyframes fade{to{opacity:1}}
@keyframes in{to{opacity:1;transform:none}}

@media (max-width:420px){
  .vcr{height:30px;min-width:32px;padding:0 7px;font-size:11px}
  .osd{top:10px;left:12px}.osd-r{left:auto;right:12px}
}
/* phone turned sideways: the video takes the whole screen */
@media (orientation: landscape) and (max-height: 520px){
  .page{padding:0;justify-content:center}
  .rlogo,.next,.tapes{display:none}
  .deck{height:100%;justify-content:center}
  .player{width:min(100%,calc(100svh * 4 / 3));height:100%;aspect-ratio:auto}
  .player[data-tape="2"]{width:min(100%,calc(100svh * 1.85))}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  .rlogo,.player,.next{opacity:1;transform:none}
}
</style>
</head>
<body>
<main class="page">
  <span class="rlogo" role="img" aria-label="REVO × RTF"></span>

  <div class="deck">
  <div class="player" id="player" data-tape="1">
    <video id="v" src="/revo/revo.mp4" poster="/revo/revo.jpg" playsinline webkit-playsinline preload="metadata" loop></video>
    <span class="osd glow" id="osd">STOP ■</span>
    <span class="osd osd-r glow" id="osdr">TAPE 1</span>
    <button class="big glow" id="big" type="button" aria-label="Відтворити">► PLAY</button>
    <div class="bar">
      <div class="track" id="track" role="slider" aria-label="Перемотка" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0"><span><i id="fill"></i></span><b id="head"></b></div>
      <div class="row">
        <button class="vcr glow skip" type="button" data-act="rew" aria-label="Назад на 5 секунд">◄◄</button>
        <button class="vcr glow" type="button" data-act="play" aria-label="Відтворити"><span class="s-play">►</span><span class="s-pause">❚❚</span></button>
        <button class="vcr glow skip" type="button" data-act="ff" aria-label="Вперед на 5 секунд">►►</button>
        <button class="vcr glow" type="button" data-act="mute" aria-label="Вимкнути звук"><span class="s-off">MUTE</span><span class="s-on">SND</span></button>
        <span class="vlab glow">VOL</span>
        <input class="vol" type="range" min="0" max="1" step="0.1" value="1" aria-label="Гучність">
        <span class="time glow" id="time"><small>SP</small>0:00:00</span>
        <button class="vcr glow icon" type="button" data-act="full" aria-label="На весь екран"><svg class="fs-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><svg class="fs-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg></button>
        <button class="vcr glow icon" type="button" data-act="hide" aria-label="Сховати кнопки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
    </div>
  </div>

  <div class="tapes" role="tablist" aria-label="Касети">
    <button class="tape" type="button" role="tab" data-tape="1" aria-selected="true"><span class="t-n">TAPE 01</span><span class="t-name">REVO × RTF</span></button>
    <button class="tape" type="button" role="tab" data-tape="2" aria-selected="false"><span class="t-n">TAPE 02</span><span class="t-name">BACKSTAGE</span></button>
  </div>
  </div>

  <a class="next glow" href="/">
    <small>⏏ EJECT</small>
    <b>ДО САЙТУ HEADACHE.KYIV.UA <i>►</i></b>
  </a>
</main>

<script>
(() => {
  const P = document.getElementById('player'), v = document.getElementById('v');
  const osd = document.getElementById('osd'), big = document.getElementById('big');
  const track = document.getElementById('track'), fill = document.getElementById('fill'), head = document.getElementById('head');
  const time = document.getElementById('time'), vol = P.querySelector('.vol'), vlab = P.querySelector('.vlab');
  const btn = a => P.querySelector(`[data-act="${a}"]`);

  /* phones: volume comes from the side buttons, so the slider is only for computers */
  const touch = matchMedia('(hover: none) and (pointer: coarse)').matches;
  if (touch){ vol.hidden = true; vlab.hidden = true; btn('hide').hidden = true; }

  let idleTimer = 0;
  const fmt = s => { if (!isFinite(s)) s = 0; s = Math.floor(s); return `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
  const paintVol = () => vol.style.setProperty('--v', `${(v.muted ? 0 : v.volume) * 100}%`);
  const sync = () => {
    const playing = !v.paused && !v.ended;
    P.classList.toggle('is-playing', playing);
    if (playing) P.classList.add('started');
    P.classList.toggle('unmuted', !v.muted && v.volume > 0);
    osd.textContent = playing ? 'PLAY ►' : (v.currentTime > 0 ? 'PAUSE ❚❚' : 'STOP ■');
    btn('play').setAttribute('aria-label', playing ? 'Пауза' : 'Відтворити');
    btn('mute').setAttribute('aria-label', v.muted ? 'Увімкнути звук' : 'Вимкнути звук');
    paintVol();
    if (!playing){ P.classList.remove('idle'); clearTimeout(idleTimer); }
  };
  const progress = () => {
    const p = v.duration ? v.currentTime / v.duration : 0;
    fill.style.width = `${p * 100}%`; head.style.left = `${p * 100}%`;
    track.setAttribute('aria-valuenow', Math.round(p * 100));
    time.innerHTML = `<small>SP</small>${fmt(v.currentTime)}`;
  };
  ['play','pause','ended','volumechange','loadedmetadata'].forEach(e => v.addEventListener(e, sync));
  v.addEventListener('timeupdate', progress);

  const toggle = () => { if (v.paused || v.ended) v.play().catch(() => {}); else v.pause(); };

  /* the bar hides itself while the video plays; any touch brings it back */
  const hide = () => { clearTimeout(idleTimer); if (!v.paused) P.classList.add('idle'); };
  const wake = () => { P.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(hide, 3000); };
  const hideNow = () => { if (!P.classList.contains('started')) return; clearTimeout(idleTimer); P.classList.add('idle'); };
  P.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') wake(); });
  P.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') wake(); });
  P.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !document.fullscreenElement && !document.webkitFullscreenElement) hideNow(); });
  /* phone: tap on empty space around the video hides the controls */
  document.addEventListener('click', e => {
    if (!touch) return;
    if (P.contains(e.target) || e.target.closest('a,button,input')) return;
    hideNow();
  });
  v.addEventListener('play', wake);
  let tapStartedHidden = false;
  P.addEventListener('pointerdown', () => { tapStartedHidden = P.classList.contains('idle'); }, true);

  big.addEventListener('click', e => { e.stopPropagation(); v.muted = false; toggle(); wake(); });
  v.addEventListener('click', () => {
    if (tapStartedHidden){ wake(); return; }   /* first touch only brings the controls back */
    toggle(); wake();
  });
  btn('play').addEventListener('click', () => { toggle(); wake(); });
  btn('hide').addEventListener('click', e => { e.stopPropagation(); if (v.paused) v.play().catch(() => {}); setTimeout(hide, 0); });
  btn('rew').addEventListener('click', () => { v.currentTime = Math.max(0, v.currentTime - 5); wake(); });
  btn('ff').addEventListener('click', () => { if (v.duration) v.currentTime = Math.min(v.duration - 0.1, v.currentTime + 5); wake(); });
  btn('mute').addEventListener('click', () => { v.muted = !v.muted; if (!v.muted && v.volume === 0){ v.volume = 1; vol.value = 1; } wake(); });
  vol.addEventListener('input', () => { v.volume = Number(vol.value); v.muted = v.volume === 0; wake(); });

  /* scrub by dragging along the line */
  const seekTo = x => { const r = track.getBoundingClientRect(); if (v.duration) v.currentTime = Math.max(0, Math.min(1, (x - r.left) / r.width)) * v.duration; progress(); };
  let scrubbing = false;
  track.addEventListener('pointerdown', e => { scrubbing = true; track.setPointerCapture(e.pointerId); seekTo(e.clientX); wake(); });
  track.addEventListener('pointermove', e => { if (scrubbing){ seekTo(e.clientX); wake(); } });
  track.addEventListener('pointerup', () => { scrubbing = false; });
  track.addEventListener('pointercancel', () => { scrubbing = false; });
  track.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') v.currentTime = Math.min(v.duration || 0, v.currentTime + 5);
    if (e.key === 'ArrowLeft') v.currentTime = Math.max(0, v.currentTime - 5);
  });

  /* fullscreen: this player on Android and computers; iPhone only allows its own player */
  btn('full').addEventListener('click', () => {
    if (document.fullscreenElement || document.webkitFullscreenElement){
      (document.exitFullscreen || document.webkitExitFullscreen).call(document); return;
    }
    if (P.requestFullscreen) P.requestFullscreen().then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape').catch(() => {})).catch(() => {});
    else if (P.webkitRequestFullscreen) P.webkitRequestFullscreen();
    else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
    wake();
  });

  const onFs = () => { P.classList.toggle('is-full', !!(document.fullscreenElement || document.webkitFullscreenElement)); };
  document.addEventListener('fullscreenchange', onFs); document.addEventListener('webkitfullscreenchange', onFs);
  addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body){ e.preventDefault(); toggle(); wake(); } });
  /* two tapes in one deck: the video and its backstage */
  const TAPES = {
    1: { src: '/revo/revo.mp4', poster: '/revo/revo.jpg', label: 'TAPE 1' },
    2: { src: '/revo/backstage.mp4', poster: '/revo/backstage.jpg', label: 'TAPE 2' }
  };
  const osdr = document.getElementById('osdr');
  const tapeBtns = [...document.querySelectorAll('.tape')];
  tapeBtns.forEach(b => b.addEventListener('click', () => {
    const n = b.dataset.tape;
    if (P.dataset.tape === n) return;
    tapeBtns.forEach(x => x.setAttribute('aria-selected', String(x === b)));
    P.dataset.tape = n; osdr.textContent = TAPES[n].label;
    v.pause(); v.poster = TAPES[n].poster; v.src = TAPES[n].src; v.load();
    v.muted = false; P.classList.add('started');
    v.play().catch(() => {}); wake();
  }));

  sync(); progress();
})();
</script>
</body>
</html>
